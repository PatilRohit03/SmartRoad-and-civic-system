<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" />
  
  <!-- Perspective Road Lines -->
  <path d="M25 80 L42 28 M75 80 L58 28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" />
  <path d="M50 80 L50 28" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" />
  
  <!-- Map Pin / Hazard Alert -->
  <path d="M50 20 C40 20 32 28 32 38 C32 50 50 72 50 72 C50 72 68 50 68 38 C68 28 60 20 50 20 Z" fill="#ef4444" filter="url(#glow)" />
  <circle cx="50" cy="37" r="7" fill="#ffffff" />
</svg>
